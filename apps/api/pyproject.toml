[project]
name = "deadline-crush-api"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "asyncpg==0.32.0",
    "deadline-crush-spikes",
    "fastapi==0.162.5",
    "httpx==0.28.1",
    "uvicorn>=0.34,<1",
    "boto3>=1.35,<2",
    "pyjwt[crypto]>=2.10,<3",
    "pymupdf==1.27.2.2",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
]

[tool.uv.sources]
deadline-crush-spikes = { path = "../../packages/shared", editable = true }
