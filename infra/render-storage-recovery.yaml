# Optional separate worker. Applying this template may incur hosting charges.
# Migration is an explicit prior operator step; never migrate on worker startup.
services:
  - type: worker
    name: deadline-crush-storage-recovery
    runtime: docker
    plan: starter
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    dockerCommand: python apps/api/storage_recovery.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: APP_SCHEMA
        value: deadline_crush
      - key: WORKER_DB_POOL_MAX
        value: "3"
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
