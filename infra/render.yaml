services:
  - type: web
    name: deadline-crush-phase0-api
    runtime: docker
    plan: starter
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: PROBE_TOKEN
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
  - type: worker
    name: deadline-crush-phase0-worker
    runtime: docker
    plan: starter
    dockerfilePath: ./infra/Dockerfile
    dockerContext: .
    dockerCommand: python apps/consumer/main.py
    envVars:
      - key: DATABASE_URL
        sync: false
